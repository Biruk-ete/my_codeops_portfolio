<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Tasks</title>
</head>
<body>
    <div class="container">
        <!-- #1 -->
        <div class="task">
            <h2>Task 1</h2>
            <h1 id="mainHeading">Original Heading</h1>
            <button id="toggleBtn">Toggle Class</button>
        </div>

        <!-- #2 -->
        <div class="task">
            <h2>Task 2</h2>
            <ul id="cityList"></ul>
        </div>

        <!-- #3 -->
        <div class="task">
            <h2>Task 3</h2>
            <div id="wrapperDiv">
                <button id="bubbleBtn">Click Me</button>
            </div>
        </div>

        <!-- #4 -->
        <div class="task">
            <h2>Task 4</h2>
            <ul id="itemList">
                <li>Item 1 <button class="delete-btn">Delete</button></li>
                <li>Item 2 <button class="delete-btn">Delete</button></li>
                <li>Item 3 <button class="delete-btn">Delete</button></li>
            </ul>
        </div>

        <!-- #5 -->
        <div class="task">
            <h2>Task 5</h2>
            <form id="itemForm">
                <input type="text" id="itemInput" placeholder="Enter item">
                <button type="submit">Add</button>
            </form>
            <ul id="dynamicList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
