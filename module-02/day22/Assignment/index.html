<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Birr Watch</h1>
        <p id="status"> Loading Rates...</p>

        <form action="#" id="convert-form">
            <input type="number" id="amount" placeholder ="Amount"><br><br>
            <select name="currency" id="currency">
            </select> <br><br>   
            <button class="btn">Convert</button>
        </form>
        <div class="twobtn">
            <p id="result" placeholder="Result"></p>
            <button id="watchbtn">Add to Watchlist</button>
        </div>

        <h2>Watchlist</h2>
        <ul id="watchlist"></ul>
    </div>    
    <script src="app.js"></script>
</body>
</html>
