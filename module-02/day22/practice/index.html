<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup Form</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <!-- Theme Toggle -->
        <div class="theme-toggle-wrapper">
            <button id="themeToggle" class="theme-btn">Switch to Dark Theme</button>
        </div>

        <!-- Signup Form -->
        <h1>Sign Up</h1>
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" />
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" placeholder="Enter Ethiopian phone number" />
            </div>
            <button type="submit" id="submitBtn">Submit</button>
        </form>

        <!-- Error Area -->
        <div id="errorArea" class="error-area"></div>

        <!-- Signup Count -->
        <div id="signupCount" class="signup-count"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
