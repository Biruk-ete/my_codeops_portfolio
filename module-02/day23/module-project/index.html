<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Eats</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">Addis Eats</div>

            <div class="nav-search">
                <input id="search" type="text" placeholder="Search">
            </div>
        </div>
    </nav>


    <main>
        <section id="menu">
            <!-- contents -->
        </section>

        <aside id="cart">
            <h2>Your Order</h2>
            <div id="cart-items">

            </div>
            <div id="cart-total">
                <span>Total:</span>
                <span id="total-amount">0</span> ETB
            </div>
            <button id="checkout-btn">Place Order</button>
        </aside>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Addis Eats</h3>
                <p>Authentic Ethiopian cuisine delivered to your door.</p>
            </div>
            <div class="footer-section">
                <h3>Contact</h3>
                <p>Bole, Addis Ababa</p>
                <p>0900 123 456</p>
                <p>TeleBirr Accepted</p>
            </div>
            <div class="footer-section">
                <h3>Hours</h3>
                <p>Mon - Sat: 10:00 - 22:00</p>
                <p>Sunday: 12:00 - 20:00</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 Addis Eats. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>

</html>
