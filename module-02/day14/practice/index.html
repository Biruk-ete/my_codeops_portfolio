<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- #1 -->
    <nav class="navbar">
        <p class="logo">LOGO</p>
        
        <div class="links">
            <a href="#">HOME</a>
            <a href="#">CONTACT</a>
            <a href="#">ABOUT</a>

            <button>Sign up</button>
        </div>

        
    </nav>

    <br><br><hr><br><br>

    <!-- #2 -->
    <section class="cards">
        <div class="item">Card 1</div>
        <div class="item">Card 2</div>
        <div class="item">Card 3</div>
        <div class="item">Card 4</div>
    </section>

    <br><br><hr><br><br>

    <!-- #3 -->
    <section class="gallery">
        <img src="images/photo1.jpg" alt="Photo 1">
        <img src="images/photo2.jpg" alt="Photo 2">
        <img src="images/photo3.jpg" alt="Photo 3">
        <img src="images/photo4.jpg" alt="Photo 4">
        <img src="images/photo5.jpg" alt="Photo 5">
        <img src="images/photo6.jpg" alt="Photo 6">
    </section>

    <br><br><hr><br><br>

    <!-- #4 -->
    <div class="page">
        <header>
            Header
        </header>

        <aside>
            Sidebar
        </aside>

        <main>
            Main Content
        </main>

        <footer>
            Footer
        </footer>
    </div>

    <br><br><hr><br><br>

    <!-- #5 -->
    <div class="card">
        <span class="badge">ETB Sale</span>
        <img src="images/car.jpg" alt="Mercedes benz G63 AMG">
        <h2>Mercedes benz G63 AMG</h2>
        <p>40,000,000 ETB</p>
    </div>
</body>
</html>
