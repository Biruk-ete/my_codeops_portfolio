<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Telecom Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <!-- HEADER -->
        <header>
            <nav class="navbar">
                <div class="brand">
                    <p>Ethio Telecom</p> 
                </div>
                <div class="nav-right">
                    <input type="search" placeholder="Search" aria-label="search">
                    <div class="profile-btn">
                        <p>Profile</p>
                    </div>
                </div>
            </nav>
        </header>

        <!-- SIDEBAR -->
        <aside>
            <h2>Menu</h2>
            <ul>
                <li>Dashboard</li>
                <li>Payments</li>
                <li>Packages</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- MAIN -->
        <main>
            <h2>Account Overview</h2>

            <!-- cards -->
            <section class="cards">
                <div class="card">
                    <span class="badge">NEW</span>
                    <h3>Balance</h3>
                    <p>500 <span class="unit">ETB</span></p>
                </div>
                <div class="card">
                    <h3>Data</h3>
                    <p>15 <span class="unit">GB</span></p>
                </div>
                <div class="card">
                    <h3>Calls</h3>
                    <p>300 <span class="unit">min</span></p>
                </div>
                <div class="card">
                    <h3>SMS</h3>
                    <p>100 <span class="unit">SMS</span></p>
                </div>
            </section>

            <!-- recent activity -->
            <section class="activity">
                <h2>Recent Activity</h2>
                <div class="toolbar">
                    <button>All</button>
                    <button>Payments</button>
                    <button>Usage</button>
                </div>
            </section>
        </main>

        <!-- FOOTER -->
        <footer>
            <span>2026 Ethio Telecom Dashboard</span>
            <span>all services active</span>
        </footer>
    </div>
</body>
</html>
