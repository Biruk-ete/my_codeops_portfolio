<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Facts - Rest Countries API</title>
</head>
<body>
    <div class="container">
        <h1>Country Facts</h1>
        
        <div class="search-section">
            <input 
                type="text" 
                id="countryInput" 
                placeholder="Enter a country name..." 
                value="ethiopia"
            />
            <button id="searchBtn">Search</button>
        </div>

        <div id="facts" class="facts-container">
            <!-- Facts will be rendered here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
